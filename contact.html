    <title>Contact - Proyek Saya</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .contact-form button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .contact-info {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

</div>

            <label>Pesan:</label>
            <textarea rows="5" placeholder="Tulis pesan kamu di sini..."></textarea>
