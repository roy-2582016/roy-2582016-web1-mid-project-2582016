<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Holiday - Proyek Saya</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .holiday-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .holiday-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
        .holiday-card p {
            text-align: center;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1 style="text-align:center;">My Holiday Gallery</h1>

    <div class="holiday-container">
        <div class="holiday-card">
            <img src="images/holiday1.jpeg" alt="Holiday 1 - Kebun">
            <p>Holiday 1 - Suasana Kebun</p>
        </div>
        <div class="holiday-card">
            <img src="images/holiday2.jpeg" alt="Holiday 2 - habis memberi obat pada cabai">
            <p>Holiday 2</p>
        </div>
        <div class="holiday-card">
            <img src="images/holiday3.jpeg" alt="Holiday 3 - ngutip cabe kami">
            <p>Holiday 3</p>
        </div>
        <div class="holiday-card">
            <img src="images/holiday4.jpeg" alt="Holiday 4 - acara manggang manggang">
            <p>Holiday 4</p>
        </div>
        <div class="holiday-card">
            <img src="images/holiday5.jpeg" alt="Holiday 5 - acara permata">
            <p>Holiday 5</p>
        </div>
        <div class="holiday-card">
            <img src="images/holiday6.jpeg" alt="Holiday 6 - mandi di haranggaol">
            <p>Holiday 6</p>
        </div>
        <div class="holiday-card">
            <img src="images/holiday7.jpeg" alt="Holiday 7 - Danau">
            <p>Holiday 7 - Di Danau</p>
        </div>
    </div>

    <div style="text-align:center; margin:30px;">
        <a href="index.html">Kembali ke Home</a>
    </div>

</body>
</html>
